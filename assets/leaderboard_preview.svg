<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="menuBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#141c36"/>
      <stop offset="100%" stop-color="#241b3e"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#menuBg)"/>

  <!-- Ground -->
  <g transform="translate(0, 670)">
    <rect width="1280" height="50" fill="#0f172a"/>
    <rect width="1280" height="4" fill="#38bdf8"/>
    <rect y="4" width="1280" height="12" fill="#1e293b"/>
  </g>

  <!-- Left Side: Game Title & Controls -->
  <g transform="translate(100, 100)">
    <!-- Main Title -->
    <text x="0" y="60" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="72" filter="url(#goldGlow)">SSAFY RUN</text>
    <text x="0" y="105" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="22">OVENBREAK : 지각 위기 탈출기!</text>
    <text x="0" y="145" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="16">⏰ 9시 입실 체크 전까지 역삼역에서 멀캠까지 전력 질주하라!</text>

    <!-- My High Score Badge -->
    <g transform="translate(0, 185)">
      <rect width="320" height="48" rx="24" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
      <text x="160" y="30" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18">👑 내 최고 기록: 9,800 점</text>
    </g>

    <!-- Start Button -->
    <g transform="translate(0, 265)">
      <rect width="320" height="64" rx="16" fill="url(#btnGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#goldGlow)"/>
      <text x="160" y="40" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24">▶ 게임 시작 (START)</text>
    </g>

    <!-- Controls Button -->
    <g transform="translate(0, 350)">
      <rect width="320" height="48" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="160" y="30" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16">📖 조작법 &amp; 아이템 자석 가이드</text>
    </g>

    <!-- Controls Shortcut -->
    <text x="160" y="435" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="14">[Space] 키나 화면 터치로 즉시 시작</text>
  </g>

  <!-- Right Side: Prominent Live Leaderboard Card (명예의 전당) -->
  <g transform="translate(680, 80)">
    <!-- Container Card with glowing border -->
    <rect width="500" height="530" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#goldGlow)" opacity="0.96"/>

    <!-- Header -->
    <text x="250" y="52" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="26" filter="url(#goldGlow)">🏆 전국 명예의 전당 (실시간 랭킹)</text>
    <g transform="translate(250, 78)">
      <circle cx="-90" cy="-4" r="5" fill="#22c55e"/>
      <text x="-75" y="0" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="13">Firebase 실시간 클라우드 DB 연동됨</text>
    </g>

    <!-- Rank 1: Gold Card -->
    <g transform="translate(25, 105)">
      <rect width="450" height="68" rx="12" fill="#854d0e" fill-opacity="0.75" stroke="#facc15" stroke-width="2"/>
      <text x="20" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24">🥇 멀캠1타강사</text>
      <text x="430" y="32" text-anchor="end" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22">9,800점</text>
      <text x="430" y="52" text-anchor="end" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">1,680m · 10.26</text>
    </g>

    <!-- Rank 2: Silver Card -->
    <g transform="translate(25, 185)">
      <rect width="450" height="64" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="20" y="39" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="21">🥈 1일1커밋장인</text>
      <text x="430" y="30" text-anchor="end" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20">7,500점</text>
      <text x="430" y="50" text-anchor="end" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">1,320m · 10.26</text>
    </g>

    <!-- Rank 3: Bronze Card -->
    <g transform="translate(25, 260)">
      <rect width="450" height="64" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#b45309" stroke-width="1.5"/>
      <text x="20" y="39" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="21">🥉 아아수혈러버</text>
      <text x="430" y="30" text-anchor="end" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20">5,600점</text>
      <text x="430" y="50" text-anchor="end" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13">1,040m · 10.26</text>
    </g>

    <!-- Rank 4 -->
    <g transform="translate(25, 335)">
      <rect width="450" height="58" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="25" y="35" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="18">4. 비상계단스프린터</text>
      <text x="430" y="28" text-anchor="end" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="18">4,200점</text>
      <text x="430" y="46" text-anchor="end" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">820m · 10.26</text>
    </g>

    <!-- Rank 5 -->
    <g transform="translate(25, 405)">
      <rect width="450" height="58" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="25" y="35" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="18">5. 8시59분세이프</text>
      <text x="430" y="28" text-anchor="end" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="18">2,800점</text>
      <text x="430" y="46" text-anchor="end" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">560m · 10.26</text>
    </g>

    <!-- Bottom Action Button -->
    <g transform="translate(130, 475)">
      <rect width="240" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="120" y="24" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">🔍 전체 랭킹 (TOP 10) 모달 보기</text>
    </g>
  </g>
</svg>
