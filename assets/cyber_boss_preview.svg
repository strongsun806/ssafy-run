<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bossBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14040a"/>
      <stop offset="50%" stop-color="#260713"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="scarfCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="1"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bossBg)"/>

  <!-- Red Raid Alert Stripes -->
  <g fill="#ef4444" opacity="0.85">
    <polygon points="0,0 30,0 15,14 0,14"/>
    <polygon points="60,0 90,0 75,14 45,14"/>
    <polygon points="120,0 150,0 135,14 105,14"/>
    <polygon points="180,0 210,0 195,14 165,14"/>
    <polygon points="240,0 270,0 255,14 225,14"/>
    <polygon points="300,0 330,0 315,14 285,14"/>
    <polygon points="360,0 390,0 375,14 345,14"/>
    <polygon points="420,0 450,0 435,14 405,14"/>
    <polygon points="480,0 510,0 495,14 465,14"/>
    <polygon points="540,0 570,0 555,14 525,14"/>
    <polygon points="600,0 630,0 615,14 585,14"/>
    <polygon points="660,0 690,0 675,14 645,14"/>
    <polygon points="720,0 750,0 735,14 705,14"/>
    <polygon points="780,0 810,0 795,14 765,14"/>
    <polygon points="840,0 870,0 855,14 825,14"/>
    <polygon points="900,0 930,0 915,14 885,14"/>
    <polygon points="960,0 990,0 975,14 945,14"/>
    <polygon points="1020,0 1050,0 1035,14 1005,14"/>
    <polygon points="1080,0 1110,0 1095,14 1065,14"/>
    <polygon points="1140,0 1170,0 1155,14 1125,14"/>
    <polygon points="1200,0 1230,0 1215,14 1185,14"/>
  </g>

  <!-- Top Center: Boss Raid HUD -->
  <g transform="translate(640, 66)">
    <rect x="-270" y="-38" width="540" height="82" rx="18" fill="#090d16" stroke="#ef4444" stroke-width="3" filter="url(#laserGlow)"/>
    <text x="0" y="-10" text-anchor="middle" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="21">🚨 [BOSS RAID] 일타싸피 &amp; 배틀싸피 평가 보스전! 🚨</text>
    <text x="0" y="14" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">💊 디버그 패치를 획득하여 호밍 플라즈마 카운터로 보스를 격파하라!</text>
    <g transform="translate(-200, 24)">
      <rect width="400" height="14" rx="7" fill="#1e293b"/>
      <rect width="240" height="14" rx="7" fill="url(#hpGrad)"/>
      <text x="200" y="11" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10">BOSS SHIELD HP: 3 / 5</text>
    </g>
  </g>

  <!-- Cyber Circuit Ground -->
  <g transform="translate(0, 650)">
    <rect width="1280" height="70" fill="#140c1c"/>
    <rect width="1280" height="5" fill="#f97316" filter="url(#laserGlow)"/>
    <line x1="0" y1="30" x2="1280" y2="30" stroke="#451a03" stroke-width="2" stroke-dasharray="36, 18"/>
  </g>

  <!-- ============================================================== -->
  <!-- CYBER SPRINT PLAYER (Crimson Blaze Skin + AI Drone + Trail)    -->
  <!-- ============================================================== -->
  <!-- Phantom Afterimage Clones -->
  <g transform="translate(135, 515)" opacity="0.28">
    <rect x="18" y="16" width="30" height="34" rx="8" fill="#f97316"/>
    <circle cx="34" cy="4" r="13" fill="#f97316"/>
  </g>
  <g transform="translate(175, 492)" opacity="0.5">
    <rect x="18" y="16" width="30" height="34" rx="8" fill="#ef4444"/>
    <circle cx="34" cy="4" r="13" fill="#ef4444"/>
  </g>

  <!-- AI Companion Bit-Drone Firing Support Laser -->
  <g transform="translate(150, 415)" filter="url(#laserGlow)">
    <polygon points="-12,6 6,12 6,22 -12,18" fill="#22d3ee"/>
    <polygon points="44,6 26,12 26,22 44,18" fill="#22d3ee"/>
    <circle cx="16" cy="16" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="18" cy="16" r="5" fill="#22d3ee"/>
    <text x="16" y="-8" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">AI DRONE ASSIST</text>
  </g>

  <!-- Main Player Character (Crimson Blaze with Flame Scarf) -->
  <g transform="translate(220, 470)">
    <ellipse cx="34" cy="52" rx="64" ry="20" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="12, 6" filter="url(#laserGlow)"/>
    <!-- Flowing Flame Scarf -->
    <path d="M 24,18 C -8,6 -42,28 -74,14 C -48,38 -16,28 24,28 Z" fill="url(#scarfCrimson)" filter="url(#laserGlow)"/>
    <!-- Jetpack + Flame -->
    <rect x="6" y="16" width="14" height="26" rx="4" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
    <polygon points="8,42 18,42 13,65" fill="#facc15" filter="url(#laserGlow)"/>
    <!-- Suit & Head -->
    <rect x="18" y="16" width="30" height="34" rx="8" fill="#dc2626" stroke="#f97316" stroke-width="2"/>
    <circle cx="34" cy="4" r="13" fill="#fed7aa"/>
    <path d="M 20,2 C 22,-12 46,-12 49,2 L 51,-1 L 40,4 Z" fill="#1e293b"/>
    <text x="34" y="-22" text-anchor="middle" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="17" filter="url(#laserGlow)">💊 COUNTER BEAM FIRE!</text>
  </g>

  <!-- Homing Counter-Attack Plasma Beam from Player & Drone to Boss -->
  <g filter="url(#laserGlow)">
    <path d="M 275,495 L 450,445 L 540,475 L 720,395 L 860,425 L 1015,385" stroke="#22d3ee" stroke-width="6" fill="none" opacity="0.9"/>
    <path d="M 275,495 L 450,445 L 540,475 L 720,395 L 860,425 L 1015,385" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Debug Patch Collectible Item -->
  <g transform="translate(560, 520)" filter="url(#laserGlow)">
    <rect x="-26" y="-26" width="52" height="52" rx="14" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="18">&lt;/&gt;</text>
    <text x="0" y="44" text-anchor="middle" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13">💊 디버그 패치</text>
  </g>

  <!-- Boss 1: 🎱 일타싸피 AI Boss (Upper Right) -->
  <g transform="translate(1055, 340)">
    <circle cx="0" cy="0" r="64" fill="#090d16" stroke="#ef4444" stroke-width="4" filter="url(#laserGlow)"/>
    <circle cx="0" cy="0" r="28" fill="#f8fafc"/>
    <text x="0" y="11" text-anchor="middle" fill="#090d16" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="34">8</text>
    <circle cx="0" cy="-36" r="9" fill="#ef4444" filter="url(#laserGlow)"/>
    <text x="0" y="88" text-anchor="middle" fill="#f87171" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">🎱 일타싸피 AI 코어</text>
  </g>

  <!-- Boss 2: ⚔️ 배틀싸피 Heavy Cyber Tank (Lower Right Ground) -->
  <g transform="translate(1045, 575)" filter="url(#laserGlow)">
    <!-- Tank Cannon Barrel -->
    <rect x="-95" y="-18" width="65" height="14" rx="4" fill="#475569" stroke="#f97316" stroke-width="2"/>
    <!-- Tank Turret & Hull -->
    <rect x="-40" y="-28" width="80" height="32" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="-60" y="0" width="120" height="42" rx="12" fill="#0f172a" stroke="#f97316" stroke-width="3"/>
    <text x="0" y="26" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">⚔️ BATTLE TANK</text>
  </g>

  <!-- Critical Damage Popup -->
  <g transform="translate(920, 265)" filter="url(#laserGlow)">
    <rect x="-95" y="-22" width="190" height="42" rx="12" fill="#090d16" stroke="#facc15" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="17">💥 CRITICAL HIT -1 HP!</text>
  </g>
</svg>
