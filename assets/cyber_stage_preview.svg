      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">DFS 깊이우선 점프</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표 거리: 220m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
    </g>
    <g transform="translate(705, 0)">
