      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 15</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">동적계획법(DP) 코스</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표 거리: 240m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
