<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGradUnlocked" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGradBoss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180509"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Header -->
  <g transform="translate(60, 38)">
    <rect width="135" height="44" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
    <text x="67" y="28" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">◀ 메인 로비</text>

    <text x="580" y="32" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="32" filter="url(#neonGlow)">🗺️ CYBER SPRINT · 30단계 택티컬 캠페인</text>

    <g transform="translate(925, 0)">
      <rect width="235" height="44" rx="22" fill="#090d16" stroke="#facc15" stroke-width="2.5"/>
      <text x="117" y="28" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">⭐ 54 / 90  |  [ST.18 👑]</text>
    </g>
  </g>

  <!-- Chapter Tabs -->
  <g transform="translate(100, 108)">
    <g transform="translate(0, 0)">
      <rect width="340" height="46" rx="12" fill="#090d16" stroke="#22c55e" stroke-width="2"/>
      <text x="170" y="29" text-anchor="middle" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="15">✓ 챕터 1: 테헤란로 출근길 (1~10 완료)</text>
    </g>
    <g transform="translate(370, 0)">
      <rect width="340" height="46" rx="12" fill="#2563eb" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
      <text x="170" y="29" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">⚡ 챕터 2: 관통 프로젝트 (11~20 진행중)</text>
    </g>
    <g transform="translate(740, 0)">
      <rect width="340" height="46" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.75"/>
      <text x="170" y="29" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">🚀 챕터 3: 멀캠 11층 코딩 랩실 (21~30)</text>
    </g>
  </g>

