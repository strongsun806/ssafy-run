      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표 거리: 230m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
    </g>
    <g transform="translate(940, 0)">
