      <text x="105" y="40" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 19</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🔒</text>
      <text x="105" y="130" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">관통 마감 1시간 전</text>
      <text x="105" y="160" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표 거리: 280m</text>
      <text x="105" y="195" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">🔒 이전 단계 클리어 필요</text>
    </g>
    <!-- Stage 20 (Boss + Visual Logic Studio Intermission) -->
    <g transform="translate(940, 0)">
      <rect width="210" height="220" rx="16" fill="url(#cardGradBoss)" stroke="#ef4444" stroke-width="2" opacity="0.85"/>
      <rect x="12" y="10" width="186" height="22" rx="6" fill="#ef4444"/>
      <text x="105" y="25" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">🔥 BOSS &amp; LOGIC STUDIO</text>
      <text x="105" y="54" text-anchor="middle" fill="#f87171" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 20</text>
      <text x="105" y="96" text-anchor="middle" font-size="34">⚔️</text>
      <text x="105" y="136" text-anchor="middle" fill="#fca5a5" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">배틀싸피 전차 보스전</text>
