      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">반응형 프론트엔드</text>
      <text x="105" y="158" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="13">🎯 목표 거리: 270m</text>
