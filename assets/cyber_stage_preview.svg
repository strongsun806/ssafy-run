      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">비상계단 스프린트</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표 거리: 200m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
