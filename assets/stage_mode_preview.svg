<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGradUnlocked" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGradBoss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180509"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <!-- Back Button -->
    <rect width="130" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="27" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">◀ 메인 메뉴</text>

    <!-- Main Title -->
    <text x="580" y="32" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="32" filter="url(#neonGlow)">🗺️ SSAFY 30단계 코딩 로드맵</text>

    <!-- Total Stars Badge -->
    <g transform="translate(940, 0)">
      <rect width="220" height="42" rx="21" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
      <text x="110" y="27" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">⭐ 45 / 90  |  ST.18</text>
    </g>
  </g>

  <!-- Chapter Tabs -->
  <g transform="translate(100, 110)">
    <!-- Tab 1 -->
    <g transform="translate(0, 0)">
      <rect width="340" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.7"/>
      <text x="170" y="28" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">🏫 챕터 1: 알고리즘 기초 (1~10)</text>
    </g>
    <!-- Tab 2 (Active) -->
    <g transform="translate(370, 0)">
      <rect width="340" height="44" rx="10" fill="#2563eb" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
      <text x="170" y="28" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">💻 챕터 2: 관통 프로젝트 (11~20)</text>
    </g>
    <!-- Tab 3 -->
    <g transform="translate(740, 0)">
      <rect width="340" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.7"/>
      <text x="170" y="28" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">🚀 챕터 3: 자율 프로젝트 (21~30)</text>
    </g>
  </g>

  <!-- Stage Grid: 5 columns x 2 rows -->
  <!-- ROW 1 (Stages 11 ~ 15) -->
  <g transform="translate(70, 190)">
    <!-- Stage 11 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#38bdf8" stroke-width="2"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 11</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">비상계단 스프린트</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 200m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
    </g>

    <!-- Stage 12 -->
    <g transform="translate(235, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#38bdf8" stroke-width="2"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 12</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">스택과 큐의 버퍼</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 210m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
    </g>

    <!-- Stage 13 -->
    <g transform="translate(470, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#38bdf8" stroke-width="2"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 13</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">DFS 깊이우선 점프</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 220m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐☆</text>
    </g>

    <!-- Stage 14 -->
    <g transform="translate(705, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#38bdf8" stroke-width="2"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 14</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">BFS 너비우선 질주</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 230m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
    </g>

    <!-- Stage 15 -->
    <g transform="translate(940, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#38bdf8" stroke-width="2"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 15</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">동적계획법(DP) 코스</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 240m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐☆☆</text>
    </g>
  </g>

  <!-- ROW 2 (Stages 16 ~ 20) -->
  <g transform="translate(70, 445)">
    <!-- Stage 16 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#38bdf8" stroke-width="2"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 16</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">Git Conflict 해결</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 250m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐☆</text>
    </g>

    <!-- Stage 17 -->
    <g transform="translate(235, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#38bdf8" stroke-width="2"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 17</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏁</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">REST API 백엔드 레이스</text>
      <text x="105" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 260m</text>
      <text x="105" y="195" text-anchor="middle" font-size="17">⭐⭐⭐</text>
    </g>

    <!-- Stage 18 (Current Highest) -->
    <g transform="translate(470, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradUnlocked)" stroke="#facc15" stroke-width="3" filter="url(#neonGlow)"/>
      <text x="105" y="40" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 18</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🏃‍♂️</text>
      <text x="105" y="130" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">반응형 프론트엔드</text>
      <text x="105" y="160" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="13">🎯 목표: 270m</text>
      <text x="105" y="195" text-anchor="middle" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="13">도전 중! ▶</text>
    </g>

    <!-- Stage 19 (Locked) -->
    <g transform="translate(705, 0)">
      <rect width="210" height="220" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <text x="105" y="40" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 19</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">🔒</text>
      <text x="105" y="130" text-anchor="middle" fill="#475569" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">관통 마감 1시간 전</text>
      <text x="105" y="160" text-anchor="middle" fill="#334155" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 280m</text>
      <text x="105" y="195" text-anchor="middle" fill="#64748b" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">🔒 잠김</text>
    </g>

    <!-- Stage 20 (Boss - Locked) -->
    <g transform="translate(940, 0)">
      <rect width="210" height="220" rx="14" fill="url(#cardGradBoss)" stroke="#7f1d1d" stroke-width="1.5" opacity="0.6"/>
      <rect x="10" y="8" width="80" height="20" rx="5" fill="#ef4444" opacity="0.7"/>
      <text x="50" y="23" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="11">🔥 BOSS</text>
      <text x="105" y="40" text-anchor="middle" fill="#f87171" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19">STAGE 20</text>
      <text x="105" y="85" text-anchor="middle" font-size="34">⚔️</text>
      <text x="105" y="130" text-anchor="middle" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">배틀싸피 전차전</text>
      <text x="105" y="160" text-anchor="middle" fill="#7f1d1d" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13">🎯 목표: 300m</text>
      <text x="105" y="195" text-anchor="middle" fill="#7f1d1d" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12">🔒 잠김</text>
    </g>
  </g>
</svg>
