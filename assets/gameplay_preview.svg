<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="60%" stop-color="#171e38"/>
      <stop offset="100%" stop-color="#241b3e"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="jellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Distant Stars & Early Morning Dust -->
  <circle cx="120" cy="90" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="280" cy="140" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="450" cy="70" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="780" cy="110" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="950" cy="80" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="1120" cy="130" r="2" fill="#ffffff" opacity="0.7"/>

  <!-- Distant Skyline Silhouettes (Parallax Far) -->
  <g fill="#111827" opacity="0.55">
    <rect x="40" y="380" width="110" height="290"/>
    <rect x="180" y="320" width="130" height="350"/>
    <rect x="340" y="410" width="90" height="260"/>
    <rect x="460" y="300" width="150" height="370"/>
    <rect x="640" y="370" width="120" height="300"/>
    <rect x="790" y="310" width="140" height="360"/>
    <rect x="960" y="390" width="110" height="280"/>
    <rect x="1100" y="330" width="130" height="340"/>
  </g>

  <!-- Near Skyline Silhouettes (Parallax Near) -->
  <g fill="#1e293b" opacity="0.75">
    <rect x="80" y="440" width="170" height="230" rx="4"/>
    <text x="100" y="475" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">SSAFY</text>
    
    <rect x="290" y="490" width="130" height="180" rx="4"/>
    <text x="310" y="525" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">9:00 AM</text>

    <!-- Multicampus Landmark -->
    <rect x="460" y="400" width="230" height="270" rx="6"/>
    <rect x="460" y="396" width="230" height="4" fill="#38bdf8"/>
    <text x="485" y="435" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18" filter="url(#glow)">MULTICAMPUS</text>
    
    <!-- Neon Office Windows -->
    <g fill="#fef08a" opacity="0.25">
      <rect x="485" y="460" width="16" height="12"/>
      <rect x="520" y="460" width="16" height="12"/>
      <rect x="555" y="460" width="16" height="12"/>
      <rect x="590" y="460" width="16" height="12"/>
      <rect x="625" y="460" width="16" height="12"/>
      <rect x="485" y="490" width="16" height="12"/>
      <rect x="555" y="490" width="16" height="12"/>
      <rect x="625" y="490" width="16" height="12"/>
    </g>

    <rect x="730" y="460" width="160" height="210" rx="4"/>
    <text x="755" y="495" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">SEOUL CAMPUS</text>

    <rect x="930" y="420" width="190" height="250" rx="4"/>
    <text x="960" y="455" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="15">COMMIT 2026</text>
  </g>

  <!-- Pavement / Highway Ground -->
  <g transform="translate(0, 670)">
    <rect width="1280" height="50" fill="#0f172a"/>
    <!-- Glowing Neon Top Line -->
    <rect width="1280" height="4" fill="url(#glowCyan)" filter="url(#glow)"/>
    <rect y="4" width="1280" height="12" fill="#1e293b"/>
    <line x1="0" y1="28" x2="1280" y2="28" stroke="#334155" stroke-width="2" stroke-dasharray="30, 20"/>
  </g>

  <!-- Ground Obstacle: Error 500 Terminal (Jumped Over!) -->
  <g transform="translate(620, 606)">
    <!-- Stand -->
    <rect x="22" y="48" width="10" height="16" fill="#334155"/>
    <rect x="12" y="60" width="30" height="4" fill="#1e293b"/>
    <!-- Monitor Body -->
    <rect x="0" y="4" width="54" height="46" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="3" filter="url(#glow)"/>
    <rect x="6" y="10" width="42" height="34" rx="3" fill="#7f1d1d"/>
    <text x="10" y="27" fill="#ffffff" font-family="'Courier New', monospace" font-weight="900" font-size="11">ERR 500</text>
    <rect x="10" y="32" width="34" height="3" fill="#fca5a5"/>
    <rect x="10" y="37" width="22" height="2" fill="#fca5a5"/>
  </g>

  <!-- Parabolic Arc of Commit Grasses (🌱) with Magnetic Suction Curves -->
  <!-- Arc 1 -->
  <g transform="translate(430, 620)">
    <rect width="32" height="32" rx="8" fill="url(#jellyGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="16" cy="16" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="9" y1="16" x2="12" y2="16" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="20" y1="16" x2="23" y2="16" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- Arc 2 (Rising) -->
  <g transform="translate(500, 560)">
    <rect width="32" height="32" rx="8" fill="url(#jellyGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="16" cy="16" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="9" y1="16" x2="12" y2="16" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="20" y1="16" x2="23" y2="16" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- Arc 3 (Apex above obstacle) -->
  <g transform="translate(630, 520)">
    <rect width="34" height="34" rx="8" fill="url(#jellyGrad)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="17" cy="17" r="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="9" y1="17" x2="13" y2="17" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="21" y1="17" x2="25" y2="17" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- Arc 4 (Descending) -->
  <g transform="translate(740, 560)">
    <rect width="32" height="32" rx="8" fill="url(#jellyGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="16" cy="16" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="9" y1="16" x2="12" y2="16" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="20" y1="16" x2="23" y2="16" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- Arc 5 (Ground landing) -->
  <g transform="translate(810, 620)">
    <rect width="32" height="32" rx="8" fill="url(#jellyGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="16" cy="16" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="9" y1="16" x2="12" y2="16" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="20" y1="16" x2="23" y2="16" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Special Item: Floating Iced Americano (☕) -->
  <g transform="translate(940, 580)">
    <!-- Cup Glow -->
    <rect x="-4" y="-4" width="40" height="46" rx="8" fill="rgba(56, 189, 248, 0.3)" filter="url(#glow)"/>
    <!-- Cup Body -->
    <polygon points="4,12 8,40 24,40 28,12" fill="rgba(255, 255, 255, 0.7)"/>
    <!-- Espresso Liquid -->
    <polygon points="6,18 9,38 23,38 26,18" fill="#451a03"/>
    <!-- Ice Cube -->
    <rect x="11" y="20" width="5" height="5" fill="#bae6fd"/>
    <!-- Lid & Red Straw -->
    <rect x="2" y="9" width="28" height="4" fill="#ffffff" rx="1"/>
    <rect x="18" y="0" width="3.5" height="18" fill="#ef4444" rx="1"/>
    <!-- +25 HP popup -->
    <text x="36" y="22" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" filter="url(#glow)">+25 HP</text>
  </g>

  <!-- Special Item: SSAFY QR Code Phone Badge (📱) -->
  <g transform="translate(1080, 510)">
    <rect x="-3" y="-3" width="40" height="48" rx="8" fill="rgba(56, 189, 248, 0.4)" filter="url(#glow)"/>
    <rect x="0" y="0" width="34" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="4" y="4" width="26" height="30" fill="#ffffff" rx="2"/>
    <rect x="7" y="7" width="8" height="8" fill="#0f172a"/>
    <rect x="19" y="7" width="8" height="8" fill="#0f172a"/>
    <rect x="7" y="19" width="8" height="8" fill="#0f172a"/>
    <rect x="16" y="16" width="4" height="4" fill="#0f172a"/>
    <text x="40" y="24" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="15" filter="url(#glow)">+300 QR</text>
  </g>

  <!-- PLAYER CHARACTER: SSAFY Trainee in Mid-Air Leaping Jump -->
  <g transform="translate(240, 520)">
    <!-- Magnetic Attraction Waves (Green suction rings) -->
    <circle cx="34" cy="30" r="85" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="8, 6" opacity="0.35"/>
    <circle cx="34" cy="30" r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10, 8" opacity="0.2"/>

    <!-- Backpack -->
    <rect x="10" y="20" width="14" height="24" rx="4" fill="#0f172a"/>

    <!-- Jump Tucked Legs with Red Sneakers -->
    <rect x="18" y="46" width="16" height="8" fill="#1e293b"/>
    <rect x="26" y="52" width="14" height="8" fill="#1e293b"/>
    <rect x="36" y="54" width="12" height="7" fill="#ef4444" rx="2"/>
    <rect x="18" y="52" width="12" height="7" fill="#ef4444" rx="2"/>

    <!-- SSAFY Blue Hoodie Torso -->
    <rect x="20" y="18" width="26" height="32" rx="6" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>

    <!-- Orange SSAFY Lanyard & ID Badge -->
    <path d="M 26 20 L 34 38 L 42 20" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <rect x="30" y="38" width="9" height="12" fill="#ffffff" rx="1"/>
    <rect x="32" y="41" width="5" height="3" fill="#2563eb"/>

    <!-- Head & Anime Hair -->
    <circle cx="34" cy="8" r="11" fill="#fed7aa"/>
    <path d="M 23 6 C 24 -6, 44 -6, 46 6 L 47 4 L 38 7 Z" fill="#0f172a"/>
    <rect x="37" y="6" width="3" height="3" fill="#0f172a"/>
    <rect x="38" y="7" width="2" height="2" fill="#0284c7"/>
    <!-- Hurrying Sweat Drop -->
    <circle cx="43" cy="4" r="2" fill="#38bdf8"/>

    <!-- Arms Raised in Jump Motion -->
    <ellipse cx="38" cy="24" rx="6" ry="12" fill="#3b82f6" transform="rotate(35 38 24)"/>

    <!-- Pop Score Effect -->
    <text x="40" y="-12" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" filter="url(#glow)">+200 COMBO!</text>
  </g>

  <!-- HUD: Top Left (Mental HP Bar) -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" letter-spacing="1">⚡ MENTAL HP: 92%</text>
    <rect y="8" width="260" height="22" rx="6" fill="#0f172a" opacity="0.9" stroke="#475569" stroke-width="2"/>
    <rect x="2" y="10" width="235" height="18" rx="4" fill="url(#hpGrad)"/>
  </g>

  <!-- HUD: Top Center (Distance & Running Status) -->
  <g transform="translate(640, 48)">
    <text x="0" y="0" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22" filter="url(#glow)">📍 480m 질주 중 (멀캠 입실 10분 전!)</text>
  </g>

  <!-- HUD: Top Right (Score & Best & Combo & Pause) -->
  <g transform="translate(1220, 36)">
    <text x="-70" y="6" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="36" filter="url(#glow)">4,800</text>
    <text x="-70" y="30" text-anchor="end" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14">BEST: 9,800</text>
    <text x="-70" y="52" text-anchor="end" fill="#f97316" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16" filter="url(#glow)">🔥 8 COMBO! (x2)</text>
    
    <!-- Pause Button -->
    <circle cx="0" cy="18" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    <text x="0" y="24" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16">❚❚</text>
  </g>

  <!-- Mobile On-Screen Touch Controls (Subtle Overlay) -->
  <!-- Left: Slide -->
  <g transform="translate(90, 600)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="3.5" opacity="0.7"/>
    <polygon points="0,18 18,-4 6,-4 6,-22 -6,-22 -6,-4 -18,-4" fill="#f59e0b"/>
    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12">SLIDE</text>
  </g>

  <!-- Right: Jump -->
  <g transform="translate(1190, 600)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" opacity="0.7"/>
    <polygon points="0,-18 18,4 6,4 6,22 -6,22 -6,4 -18,4" fill="#38bdf8"/>
    <text x="0" y="32" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12">JUMP</text>
  </g>
</svg>
