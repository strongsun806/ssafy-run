<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ecfeff" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Synthwave Night Sky -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Giant Synthwave Cyber Moon -->
  <g transform="translate(960, 210)">
    <circle cx="0" cy="0" r="135" fill="url(#moonGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <!-- Synthwave Horizon Scanlines across Moon -->
    <rect x="-140" y="30" width="280" height="6" fill="#0f172a" opacity="0.7"/>
    <rect x="-140" y="50" width="280" height="8" fill="#0f172a" opacity="0.75"/>
    <rect x="-140" y="72" width="280" height="10" fill="#0f172a" opacity="0.8"/>
    <rect x="-140" y="96" width="280" height="14" fill="#0f172a" opacity="0.85"/>
  </g>

  <!-- Ambient Cyber Stars & Neon Motes -->
  <g fill="#38bdf8" opacity="0.75">
    <circle cx="120" cy="90" r="2"/>
    <circle cx="280" cy="140" r="2.5"/>
    <circle cx="450" cy="70" r="1.5"/>
    <circle cx="620" cy="120" r="2"/>
    <circle cx="780" cy="85" r="2.5" fill="#c084fc"/>
    <circle cx="1140" cy="110" r="2"/>
  </g>

  <!-- Far Parallax Skyscrapers with Lit Window Grids -->
  <g fill="#090d1a" opacity="0.85">
    <rect x="40" y="320" width="120" height="350"/>
    <rect x="190" y="260" width="145" height="410"/>
    <rect x="360" y="350" width="110" height="320"/>
    <rect x="500" y="240" width="160" height="430"/>
    <rect x="690" y="310" width="130" height="360"/>
    <rect x="850" y="280" width="150" height="390"/>
    <rect x="1030" y="330" width="140" height="340"/>
  </g>

  <!-- Near Parallax Cyber Buildings & Hologram Billboards -->
  <g opacity="0.92">
    <!-- Building 1 -->
    <rect x="70" y="410" width="180" height="260" rx="4" fill="#111827" stroke="#1e293b" stroke-width="2"/>
    <rect x="88" y="430" width="144" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="160" y="451" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">SSAFY CAMPUS</text>

    <!-- Building 2: Multicampus Tower -->
    <rect x="440" y="360" width="240" height="310" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="440" y="356" width="240" height="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="560" y="395" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="19" filter="url(#glow)">CYBER SPRINT</text>
    <g fill="#38bdf8" opacity="0.28">
      <rect x="468" y="418" width="22" height="14" rx="2"/>
      <rect x="505" y="418" width="22" height="14" rx="2"/>
      <rect x="542" y="418" width="22" height="14" rx="2" fill="#facc15"/>
      <rect x="579" y="418" width="22" height="14" rx="2"/>
      <rect x="616" y="418" width="22" height="14" rx="2"/>
      <rect x="468" y="446" width="22" height="14" rx="2"/>
      <rect x="542" y="446" width="22" height="14" rx="2"/>
      <rect x="616" y="446" width="22" height="14" rx="2" fill="#c084fc"/>
    </g>

    <!-- Building 3 -->
    <rect x="920" y="390" width="210" height="280" rx="4" fill="#111827" stroke="#1e293b" stroke-width="2"/>
    <rect x="942" y="412" width="166" height="30" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="2" filter="url(#glow)"/>
    <text x="1025" y="432" text-anchor="middle" fill="#4ade80" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14">1 DAY 1 COMMIT</text>
  </g>

  <!-- 2nd Floor Elevated Cyber Platform & Gold Coin Route -->
  <g transform="translate(720, 465)">
    <rect width="340" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <line x1="16" y1="11" x2="324" y2="11" stroke="#22d3ee" stroke-width="2" stroke-dasharray="18, 10"/>
    <!-- Gold Coins on 2nd Floor -->
    <g transform="translate(55, -28)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#fef08a" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" fill="#713f12" font-weight="900" font-size="12">G</text>
    </g>
    <g transform="translate(115, -28)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#fef08a" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" fill="#713f12" font-weight="900" font-size="12">G</text>
    </g>
    <g transform="translate(175, -28)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#fef08a" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" fill="#713f12" font-weight="900" font-size="12">G</text>
    </g>
    <g transform="translate(235, -28)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#fef08a" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" fill="#713f12" font-weight="900" font-size="12">G</text>
    </g>
    <g transform="translate(295, -28)">
      <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#fef08a" stroke-width="2" filter="url(#glow)"/>
      <text x="0" y="5" text-anchor="middle" fill="#713f12" font-weight="900" font-size="12">G</text>
    </g>
  </g>

  <!-- Cyber Circuit Highway Ground (With Bottomless Pit GAP) -->
  <g transform="translate(0, 665)">
    <!-- Left Segment -->
    <rect x="0" y="0" width="540" height="55" fill="#090d16"/>
    <rect x="0" y="0" width="540" height="5" fill="url(#glowCyan)" filter="url(#glow)"/>
    <line x1="20" y1="26" x2="520" y2="26" stroke="#1e293b" stroke-width="2" stroke-dasharray="36, 18"/>

    <!-- GAP Pit Hazard Warning -->
    <rect x="540" y="0" width="150" height="55" fill="#02040a"/>
    <text x="615" y="-12" text-anchor="middle" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" filter="url(#glow)">⚠️ GAP ZONE</text>

    <!-- Right Segment -->
    <rect x="690" y="0" width="590" height="55" fill="#090d16"/>
    <rect x="690" y="0" width="590" height="5" fill="url(#glowCyan)" filter="url(#glow)"/>
    <line x1="710" y1="26" x2="1260" y2="26" stroke="#1e293b" stroke-width="2" stroke-dasharray="36, 18"/>
  </g>

  <!-- Ground Obstacle: Error 500 Terminal -->
  <g transform="translate(460, 600)">
    <rect x="0" y="4" width="56" height="48" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="3" filter="url(#glow)"/>
    <rect x="6" y="10" width="44" height="36" rx="3" fill="#7f1d1d"/>
    <text x="28" y="29" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="11">ERR 500</text>
  </g>

  <!-- Parabolic Commit Nodes & Magnetic Field -->
  <g transform="translate(480, 505)" filter="url(#glow)">
    <rect width="32" height="32" rx="8" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="16" cy="16" r="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <g transform="translate(555, 455)" filter="url(#glow)">
    <rect width="32" height="32" rx="8" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="16" cy="16" r="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <g transform="translate(635, 435)" filter="url(#glow)">
    <rect width="32" height="32" rx="8" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="16" cy="16" r="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- ============================================================== -->
  <!-- CYBER SPRINT REM-ASTERED CHARACTER + AI DRONE + AFTERIMAGES    -->
  <!-- ============================================================== -->

  <!-- 1. 360° Double-Jump Shockwave Ring -->
  <g transform="translate(335, 515)">
    <ellipse cx="0" cy="25" rx="78" ry="26" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="14, 8" opacity="0.75" filter="url(#glow)"/>
    <ellipse cx="0" cy="25" rx="52" ry="16" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 2. Cyber Phantom Afterimage Trail (3 Ghost Clones) -->
  <g transform="translate(215, 555)" opacity="0.22">
    <rect x="16" y="16" width="28" height="34" rx="7" fill="#06b6d4"/>
    <circle cx="30" cy="6" r="12" fill="#06b6d4"/>
  </g>
  <g transform="translate(255, 525)" opacity="0.38">
    <rect x="16" y="16" width="28" height="34" rx="7" fill="#22d3ee"/>
    <circle cx="30" cy="6" r="12" fill="#22d3ee"/>
  </g>
  <g transform="translate(295, 498)" opacity="0.55">
    <rect x="16" y="16" width="28" height="34" rx="7" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="30" cy="6" r="12" fill="#38bdf8"/>
  </g>

  <!-- 3. Autonomous AI Companion Bit-Drone (Hovering Behind Player) -->
  <g transform="translate(225, 430)" filter="url(#glow)">
    <!-- Energy Tether Line -->
    <path d="M 35,25 Q 75,45 110,50" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
    <!-- Holo Wings -->
    <polygon points="-14,8 6,14 6,24 -14,20" fill="#22d3ee" opacity="0.85"/>
    <polygon points="46,8 26,14 26,24 46,20" fill="#22d3ee" opacity="0.85"/>
    <!-- Drone Core -->
    <circle cx="16" cy="18" r="13" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="18" cy="18" r="5" fill="#22d3ee"/>
    <circle cx="20" cy="16" r="2" fill="#ffffff"/>
    <!-- Antenna -->
    <line x1="16" y1="5" x2="16" y2="-3" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="16" cy="-4" r="3" fill="#facc15"/>
    <text x="16" y="-12" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="10">AI BIT-DRONE</text>
  </g>

  <!-- 4. Main Player Character (Neo Runner with Flowing Cyber Scarf & Jetpack) -->
  <g transform="translate(330, 470)">
    <!-- Magnetic Aura -->
    <circle cx="34" cy="26" r="68" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10, 6" opacity="0.55" filter="url(#glow)"/>

    <!-- Flowing Neon Cyan Energy Scarf (Wave Physics) -->
    <path d="M 24,18 C -5,8 -35,28 -68,14 C -45,36 -15,26 24,28 Z" fill="url(#scarfGrad)" filter="url(#glow)"/>
    <path d="M 24,22 C -2,18 -28,36 -54,28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>

    <!-- Techwear Jetpack + Plasma Thruster Flame -->
    <rect x="6" y="16" width="14" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="8,42 18,42 13,64" fill="#22d3ee" filter="url(#glow)"/>
    <polygon points="10,42 16,42 13,54" fill="#ffffff"/>

    <!-- Hover-Sole Cyber Sneakers -->
    <rect x="16" y="48" width="15" height="9" rx="3" fill="#ef4444"/>
    <rect x="15" y="55" width="17" height="3" rx="1" fill="#22d3ee" filter="url(#glow)"/>
    <rect x="35" y="50" width="15" height="9" rx="3" fill="#ef4444"/>
    <rect x="34" y="57" width="17" height="3" rx="1" fill="#22d3ee" filter="url(#glow)"/>

    <!-- Neo Runner Techwear Hoodie -->
    <rect x="18" y="16" width="30" height="34" rx="8" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
    <path d="M 26,18 L 34,36 L 42,18" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <rect x="30" y="35" width="9" height="11" rx="1.5" fill="#ffffff"/>

    <!-- Anime Head, Catchlight Eyes & Cyber Visor -->
    <circle cx="34" cy="4" r="13" fill="#fed7aa"/>
    <path d="M 20,2 C 22,-12 46,-12 49,2 L 51,-1 L 40,4 Z" fill="#0f172a"/>
    <!-- Anime Eye with Specular Catchlight -->
    <rect x="38" y="1" width="5" height="6" rx="2" fill="#0f172a"/>
    <circle cx="40" cy="2.5" r="1.5" fill="#ffffff"/>
    <circle cx="41.5" cy="5" r="1" fill="#38bdf8"/>
    <!-- Cheek Blush -->
    <ellipse cx="42" cy="8" rx="3" ry="1.5" fill="#fb7185" opacity="0.65"/>

    <!-- Pop Score Text -->
    <text x="35" y="-22" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18" filter="url(#glow)">⚡ DOUBLE JUMP + SHOCKWAVE!</text>
  </g>

  <!-- HUD: Top Left (Mental HP + Active Buffs) -->
  <g transform="translate(40, 32)">
    <rect width="310" height="64" rx="14" fill="#090d16" opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
    <text x="18" y="24" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13">⚡ MENTAL HP · 96%  |  🪙 1,280 G</text>
    <rect x="18" y="34" width="274" height="16" rx="8" fill="#1e293b"/>
    <rect x="20" y="36" width="260" height="12" rx="6" fill="url(#hpGrad)" filter="url(#glow)"/>
  </g>

  <!-- HUD: Top Center (Stage Progress Banner) -->
  <g transform="translate(640, 52)">
    <rect x="-210" y="-24" width="420" height="44" rx="22" fill="#090d16" opacity="0.9" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18">📍 STAGE 18 질주 중 · 245m / 270m (90%)</text>
  </g>

  <!-- HUD: Top Right (Score & Combo) -->
  <g transform="translate(1230, 36)">
    <text x="-60" y="12" text-anchor="end" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="34" filter="url(#glow)">14,850</text>
    <text x="-60" y="38" text-anchor="end" fill="#facc15" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="15">🔥 24 COMBO · PHANTOM BOOST!</text>
    <circle cx="-16" cy="18" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="-16" y="24" text-anchor="middle" fill="#38bdf8" font-weight="900" font-size="15">❚❚</text>
  </g>
</svg>
